# Render Blueprint — Stellora Express API
#
# The backend is a long-running Express process (auto-pilot scheduler runs on a
# timer and uploaded media lives on local disk), so it CANNOT run on Netlify
# Functions. Deploy it here instead:
#
#   Render Dashboard → New → Blueprint → pick this repo → Render reads render.yaml
#
# Fill in the sync:false secrets after the first sync (MONGODB_URI etc.).
docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stellora-api
    runtime: bun
    plan: free
    autoDeploy: true
    buildCommand: bun install --frozen-lockfile
    startCommand: cd backend && bun src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_URL
        sync: false
      # Both Netlify sites (*.netlify.app subdomains, incl. deploy previews)
      # pass the backend's same-origin (CSRF) allowlist. Append your custom
      # domain suffix when you attach one, e.g. ".netlify.app,.myshop.com"
      - key: ORIGIN_SUFFIXES
        value: ".netlify.app"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: DEMO_CUSTOMER_EMAIL
        sync: false
      - key: DEMO_CUSTOMER_PASSWORD
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_DEMO_SECRET
        sync: false
      - key: UPLOAD_MAX_MB
        value: "5"
