---
# Stellora — cPanel Git™ Version Control deployment tasks
#
# Ye file cPanel ke "Deploy HEAD Commit" button ko zinda karti hai.
# Flow:  Update from Remote (git pull)  ->  Deploy HEAD Commit (ye tasks)
#
# Tasks repo directory ke andar chalte hain, isliye RELATIVE path kaam
# karta hai — repo /home/USER/repositories/Stellora ho ya koi bhi aur
# location, farak nahi padta.
#
# scripts/deploy.sh khud detached worker spawn karta hai (nohup/setsid) —
# cPanel UI turant return kar deta hai aur asli build+restart background
# me chalta hai. Progress:  tail -f ~/deploy.log
deployment:
  tasks:
    - bash scripts/deploy.sh
