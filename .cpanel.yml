---
# cPanel Git™ Version Control deployment config
# Runs automatically on every "Pull / Deploy" from cPanel.
# Full guide: deploy/CPANEL-DEPLOY.md
deployment:
  tasks:
    - export DEPLOY=/home/$USER/stellora
    - /bin/cp -r ./ $DEPLOY
    - /bin/rm -rf $DEPLOY/.git
    - cd $DEPLOY
    - npm install --no-audit --no-fund
    - npm run build
    - npm run build:backend
    - /bin/echo "Stellora deployed. Restart the Node.js app from Setup Node.js App."
...
