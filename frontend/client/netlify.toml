# Netlify — storefront site (Stellora client)
#
# Monorepo setup: in Netlify UI set
#   Base directory  =  frontend/client
# Netlify reads this netlify.toml from the base directory.
#
# Required site environment variables (Site configuration → Environment variables):
#   BACKEND_URL  — Express API base, e.g. https://stellora-api.onrender.com  (no trailing slash)
#   ADMIN_URL    — admin site base,    e.g. https://stellora-admin.netlify.app (no trailing slash)
#
# The Next.js rewrites (next.config.ts) proxy /api/* and /uploads/* to BACKEND_URL
# and /admin-console/* to ADMIN_URL, so the whole stack stays same-origin
# (httpOnly session cookies keep working with zero CORS changes).

[build]
  # bun.lock lives at the repo root (bun workspace) — install from there, then
  # build just the client. `bun next build` resolves the local binary reliably
  # regardless of PATH handling after `cd`.
  command = "cd ../.. && bun install --frozen-lockfile && bun run build:client"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
